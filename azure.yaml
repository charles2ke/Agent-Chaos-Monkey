name: agent-chaos-monkey
metadata:
  template: agent-chaos-monkey@1.0.0

# Bakes the Container App's URL into the SPA build so `azd up` is a genuine one-command
# deploy: no manual `azd env set` / `azd deploy web` steps are required afterwards. Vite
# picks up `frontend/.env.production` automatically because `azd deploy` runs `npm run
# build`, which defaults to production mode.
hooks:
  postprovision:
    posix:
      shell: sh
      run: |
        set -eu
        if [ -z "${SERVICE_API_URI:-}" ]; then
          echo "SERVICE_API_URI is not set; cannot wire the frontend to the API." >&2
          exit 1
        fi
        echo "VITE_API_BASE_URL=$SERVICE_API_URI" > frontend/.env.production
      interactive: false
    windows:
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        if ([string]::IsNullOrEmpty($env:SERVICE_API_URI)) {
          throw "SERVICE_API_URI is not set; cannot wire the frontend to the API."
        }
        Set-Content -Path frontend/.env.production -Value "VITE_API_BASE_URL=$env:SERVICE_API_URI"
      interactive: false

services:
  api:
    project: ./backend/ChaosMonkey.Api
    language: dotnet
    host: containerapp
    docker:
      path: ./Dockerfile
      context: ../
  web:
    project: ./frontend
    language: js
    host: staticwebapp
    dist: dist
