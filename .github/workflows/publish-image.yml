name: Publish API container image

on:
  push:
    branches:
      - main
    tags:
      - 'api-v*'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/publish-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: charles2ke/agent-chaos-monkey-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short
            type=match,pattern=api-v(.*),group=1
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/api-v') }}
          labels: |
            org.opencontainers.image.title=Agent Chaos Monkey API
            org.opencontainers.image.description=Chaos gateway and resilience API for AI agents
            org.opencontainers.image.licenses=MIT

      # A successful build does not prove the image runs: a base image whose .NET major
      # differs from the project's TargetFramework builds fine but cannot start. Run the
      # image and probe it before anything is pushed.
      - name: Build image for smoke test
        uses: docker/build-push-action@v7
        with:
          context: backend
          file: backend/ChaosMonkey.Api/Dockerfile
          load: true
          tags: agent-chaos-monkey-api:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name chaos-api-smoke --publish 127.0.0.1:8080:8080 agent-chaos-monkey-api:smoke > /dev/null
          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then docker logs chaos-api-smoke || true; fi
            docker rm --force chaos-api-smoke > /dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for _ in $(seq 1 30); do
            if curl --fail --silent --connect-timeout 2 --max-time 5 http://127.0.0.1:8080/api/health > /dev/null; then
              ready="$(curl --fail --silent --show-error --connect-timeout 2 --max-time 5 http://127.0.0.1:8080/api/health/ready)"
              echo "Container is serving requests: ${ready}"
              exit 0
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' chaos-api-smoke)" != "true" ]; then
              echo "::error::The API container exited before serving /api/health."
              exit 1
            fi
            sleep 1
          done
          echo "::error::The API container did not serve /api/health within 30 seconds."
          exit 1

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: backend
          file: backend/ChaosMonkey.Api/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate build provenance attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
