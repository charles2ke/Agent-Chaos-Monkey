name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run build
        env:
          # Project pages are served from https://<owner>.github.io/<repo>/
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          # No backend on Pages: run the demo agent, chaos engine and judge in the browser.
          VITE_STATIC_DEMO: 'true'

      # actions/configure-pages is not used: the workflow GITHUB_TOKEN cannot
      # create or read the Pages site, and the base path is set explicitly
      # above. Enable Pages once in Settings > Pages with source
      # "GitHub Actions".
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # actions/deploy-pages fails with an opaque 404 when no Pages site exists,
      # and the workflow GITHUB_TOKEN is not allowed to create one. Probe first
      # so the run reports actionable guidance instead of failing.
      - id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" --silent 2>/dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub Pages is not enabled. Enable it in Settings > Pages with \"GitHub Actions\" as the source, then re-run this workflow. The built site is available as the github-pages artifact of this run."
            {
              echo "## GitHub Pages is not enabled"
              echo
              echo "The site was built successfully but could not be published, so"
              echo "<https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/> returns 404."
              echo
              echo "This is a one-time repository setting; the workflow token is not allowed to create the Pages site."
              echo
              echo "1. Open <https://github.com/${{ github.repository }}/settings/pages>."
              echo "2. Under **Build and deployment**, set **Source** to **GitHub Actions**."
              echo "3. Re-run this workflow."
              echo
              echo "The built site is attached to this run as the \`github-pages\` artifact."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - id: deployment
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
